[package]
name = "futures-timer"
version = "3.0.4"
authors = ["Alex Crichton <alex@alexcrichton.com>"]
edition = "2018"
license = "MIT/Apache-2.0"
readme = "README.md"
repository = "https://github.com/async-rs/futures-timer"
homepage = "https://github.com/async-rs/futures-timer"
documentation = "https://docs.rs/futures-timer"
description = """
Timeouts for futures.
"""

[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-timers = { version = "0.4.0", features = ["futures"], optional = true }
send_wrapper = { version = "0.6.0", optional = true }

# WASI Preview 2 backend: a `wasi:clocks` timer driven by the `wstd` reactor.
# Pulled in only for `wasm32-wasip2`, where the default thread-based backend
# cannot run (the component model is single-threaded).
[target.'cfg(all(target_arch = "wasm32", target_os = "wasi", target_env = "p2"))'.dependencies]
wstd = "0.6"
wasip2 = "1.0"

[dev-dependencies]
async-std = { version = "1.13", features = ["attributes"] }
futures = "0.3.1"

[features]
wasm-bindgen = [
    "gloo-timers",
    "send_wrapper"
]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(assert_timer_heap_consistent)'] }
